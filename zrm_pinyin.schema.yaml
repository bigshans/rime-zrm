# Rime schema
# encoding: utf-8

schema:
  schema_id: zrm_pinyin
  name: 自然码+辅助码
  version: "0.15"
  author:
    - aerian
  description: |
    自然码+辅助码方案。
  dependencies:
    - stroke

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: simplification
    states: [ 漢字, 汉字 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - reverse_lookup_translator
    - script_translator
  filters:
    - simplifier
    - uniquifier

speller:
  alphabet: "zyxwvutsrqponmlkjihgfedcba;ZYXWVUTSRQPONMLKJIHGFEDCBA"
  delimiter: " '"
  algebra:
    - derive/^(\w*);(\w)(\w*)$/$1;$2/
    - derive/^(\w*);(\w*)$/$1/
    - derive/^([a-z].+)$/\U$1/
    # 支持大写字符
    - derive/^([a-zA-Z])/\U$1/
    - derive/^([a-z][a-z])/\U$1/
    # 模糊音设置例子，`en` 和 `eng` 模糊音设置
    # - derive/^(\w)g;(\w)(\w)$/$1f;$2$3/
    # - derive/^(\w)g;(\w)(\w)$/$1f;$2/
    # - derive/^(\w)g;(\w)(\w)$/$1f/

translator:
  dictionary: zrm_pinyin
  prism: zrm_pinyin
  preedit_format:
    - xform/(?<!;)([bpmnljqxy])n/$1in/
    - xform/(?<!;)([bcdfghklmprst])g/$1eng/
    - xform/(?<!;)([bdlmnq])q/$1iu/
    - xform/(?<!;)([gkhvuirzcrs])w/$1ua/
    - xform/(?<!;)([dljqx])w/$1ia/
    - xform/(?<!;)([dtnlgkhjqxyvuirzcrs])r/$1uan/
    - xform/(?<!;)([nljqxy])t/$1ve/
    - xform/(?<!;)([gkhvuirzcrs])y/$1uai/
    - xform/(?<!;)([bpmdtnljqxy])y/$1ing/
    - xform/(?<!;)([dtnlgkhvuirzcrs])o/$1uo/
    - xform/(?<!;)([dtnlgkhviurzcs])p/$1un/
    - xform/(?<!;)([jqx])s/$1iong/
    - xform/(?<!;)([dtnlgkhvirzcsy])s/$1ong/
    - xform/(?<!;)([bjqxnl])d/$1iang/
    - xform/(?<!;)([gkhivu])d/$1uang/
    - xform/(?<!;)([bpmfdngkhvifurzcs])f/$1en/
    - xform/(?<!;)([bpmfdtnlgkhviuzciywr])h/$1ang/
    - xform/(?<!;)([bpmfdtnlgkhviuzciywr])j/$1an/
    - xform/(?<!;)([bpmdtnlgkhviuzciyr])k/$1ao/
    - xform/(?<!;)([bpmdtnlgkhviuzcir])l/$1ai/
    - xform/(?<!;)([bpmfdnlgkhiuzw])z/$1ei/
    - xform/(?<!;)([bpmdtnljqx])x/$1ie/
    - xform/(?<!;)([bpmfdtnljqx])c/$1iao/
    - xform/(?<!;)([dtgkhvuirzcrs])v/$1ui/
    - xform/(?<!;)([pmfdtnlgkhviurzcsy])b/$1ou/
    - xform/(?<!;)([bpmdtnljqx])m/$1ian/
    - xform/(?<!;)([aoe])\1(\w)/$1$2/
    - "xform/(?<!;)(^|[ '])v/$1zh/"
    - "xform/(?<!;)(^|[ '])i/$1ch/"
    - "xform/(?<!;)(^|[ '])u/$1sh/"
    - xform/(?<!;)([jqxy])v/$1u/
    - xform/(?<!;)([nl])v/$1ü/
    - xform/(?<!;>)ah/ang/
    - xform/(?<!;>)eh/eng/

reverse_lookup:
  dictionary: stroke
  enable_completion: true
  prefix: "`"
  suffix: "'"
  tips: 〔筆畫〕
  preedit_format:
    - xlit/hspnz/一丨丿丶乙/
  comment_format:
    - xform/([nl])v/$1ü/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
